<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow">
    <title id="documentTitle"></title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="pageContent">
        <div style="text-align: right;padding-right: 30px;">
            <p id="lastUpdateText" style="font-style: italic; font-size: 14px; color: #CCC"></p>
        </div>

        <p class="title">Cronología de episodios</p>
        <div class="svgContainer">
            <svg class="svgChart" id="timelineSVG"></svg>
        </div>
        
        <p class="title">Proporción de episodios por día de la semana</p>
        <div class="chartContainer">
            <canvas id="dayCounterChart"></canvas>
        </div>  
        
        <p class="title">Proporción de episodios por mes</p>
        <div class="chartContainer">
            <canvas id="yearMonthCounterChart"></canvas>
        </div>

        <p class="title">Intervalos entre episodios</p>
        <div class="chartControls">
            <label class="chartCheckbox">
                <input type="checkbox" id="hideExtremesCheck">
                Desactivar extremos
            </label>
        </div>
        <div class="chartContainer">
            <canvas id="intervalChart"></canvas>
        </div>

        <p class="title">KPIs</p>
        <div class="kpiContainer" id="kpiSummary"></div>
        
        <p class="title">Recuento</p>
        <div class="container">
            <div class="column">
                <h4 id="dayCounterTitle"></h4>
                <div id="eventsPerDay" class="statsContainer"></div>
            </div>
            <div class="column">
                <h4 id="monthCounterTitle"></h4>
                <div id="eventsPerMonth" class="statsContainer"></div>
            </div>
            <div class="column">
                <h4>Resumen</h4>
                <div id="extraInfo" class="statsContainer"></div>
            </div>
        </div>

        <div style="margin-bottom: 50px"></div>
    </div>

    <!--<script src="../js/firebase-app.js"></script>-->
	<!--<script src="../js/firebase-database.js"></script>-->

    <script src="firebase-app.js"></script>
	<script src="firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="constants.js"></script>
    <script src="utils.js"></script>
    <script src="stats.js"></script>
    <script src="timeline.js"></script>
    <script src="chart.js"></script>
    <script src="script.js"></script>

</body>

</html>
